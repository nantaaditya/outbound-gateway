server:
  port: 0

spring:
  application:
    name: app-test
  webflux:
    base-path: ${CONTEXT_PATH:}
  r2dbc:
    pool:
      enabled: true
      initial-size: 5
      max-size: 10
      validation-query: SELECT 1
  flyway:
    enabled: true
  sql:
    init:
      mode: never

management:
  server:
    port: 0
  metrics:
    tags:
      env: ${METRICS_ENV:test}
    distribution:
      # Mirrors main application.yml — contract tests assert histogram buckets exist
      percentiles-histogram:
        api.public: true
  endpoint:
    shutdown.access: none
    health.show-details: always
  endpoints:
    web:
      exposure.include: '*'
  tracing:
    sampling:
      probability: 1.0
    baggage:
      remote-fields:
        - x-client-id
        - x-request-id
      correlation:
        fields:
          - x-client-id
          - x-request-id

logging:
  level:
    root: INFO
    com.nantaaditya: INFO
    org.zalando.logbook: TRACE
  file:
    path: ${LOG_PATH:logs/}
  config: classpath:log4j2-spring-${apps.log.log-format:json}.xml

gateway:
  encryption:
    key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=  # 32 zero-bytes base64, test only

apps:
  version: 1.0.0
  log:
    enable-trace-log: true
    ignored-trace-log-path: ${IGNORED_TRACE_LOG_PATH:*/swagger-ui,*/swagger-ui/*,*/v3/api-docs,*/v3/api-docs/*}
    sensitive-field: ${SENSITIVE_FIELDS:x-client-id,authorization,proxy-authorization,x-api-key,x-auth-token,x-secret,x-client-secret,x-access-token}
    log-format: json
  scheduler.configurations:
    default-async:
      scheduler-type: BOUNDED_ELASTIC
      bounded-elastic:
        name: default-async
        daemon: true
        core-pool-size: 5
        queue-size: 10
        ttl-in-seconds: 60
    retry-listener:
      scheduler-type: BOUNDED_ELASTIC
      bounded-elastic:
        name: retry-listener
        daemon: true
        core-pool-size: 10
        queue-size: 20
        ttl-in-seconds: 60
  async:
    configurations:
      default:
        core-pool-size: 5
        max-pool-size: 20
        queue-capacity: 100
        keep-alive-seconds: 60
        thread-name-prefix: default-task-
        enable-virtual-thread: true
  cache.configurations:
    jslt:
      type: SIZE
      size: 200
    contexts:
      type: TIME
      time-out: 10
      time-unit: MINUTES
    additional-data:
      type: TIME
      time-out: 10
      time-unit: MINUTES