server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ${APP_NAME:outbound-gateway}
  webflux:
    base-path: ${CONTEXT_PATH:/app}
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/outbox-gateway}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    pool:
      enabled: true
      initial-size: ${DB_POOL_SIZE:5}
      max-size: ${DB_MAX_POOL_SIZE:10}
      max-idle-time: ${DB_IDLE_TIME:30s}
      max-life-time: ${DB_LIFE_TIME:60S}
      validation-query: SELECT 1
      validation-depth: remote
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/outbox-gateway}
    user: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    enabled: ${FLYWAY_ENABLED:true}
    validate-on-migrate: ${FLYWAY_VALIDATION_ENABLED:false}
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

management:
  server:
    port: ${ACTUATOR_PORT:1000}
  metrics:
    tags:
      # Environment label on every metric so a shared Prometheus can distinguish environments
      env: ${METRICS_ENV:local}
    distribution:
      # Scoped to api.public only: histogram buckets are needed for p95/p99 alerting,
      # but enabling globally would multiply cardinality for every meter.
      percentiles-histogram:
        api.public: true
  endpoint:
    shutdown.access: ${ACTUATOR_SHUTDOWN:none}
    health.show-details: ${HEALTH_DETAIL:always}
  endpoints:
    web:
      exposure.include: ${ACTUATOR_EXPOSED:*}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    baggage:
      remote-fields:
        - x-client-id
        - x-request-id
      correlation:
        fields:
          - x-client-id
          - x-request-id

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    com.nantaaditya: ${APP_LOG_LEVEL:INFO}
    org.zalando.logbook: ${ZALANDO_LOG_LEVEL:TRACE}
  file:
    path: ${LOG_PATH:logs/}
  config: classpath:log4j2-spring-${apps.log.log-format:json}.xml

gateway:
  encryption:
    key: ${GATEWAY_ENCRYPTION_KEY:scWGlyQHYTRRfbA8OsdPI+oNm3PbPUR8O/ZjNA/kthI=}

apps:
  version: ${APP_VERSION:1.0.0}
  filter.max-body-bytes: ${MAX_PAYLOAD_SIZE:1048576}
  log:
    enable-trace-log: ${ENABLE_TRACE_LOG:true}
    ignored-trace-log-path: ${IGNORED_TRACE_LOG_PATH:*/swagger-ui,*/swagger-ui/*,*/v3/api-docs,*/v3/api-docs/*}
    sensitive-field: ${SENSITIVE_FIELDS:x-client-id,authorization,proxy-authorization,x-api-key,x-auth-token,x-secret,x-client-secret,x-access-token}
    log-format: ${APPS_LOG_FORMAT:json}
  async:
    configurations:
      default:
        core-pool-size: ${DEFAULT_TASK_CORE_POOL_SIZE:5}
        max-pool-size: ${DEFAULT_TASK_MAX_POOL_SIZE:20}
        queue-capacity: ${DEFAULT_TASK_QUEUE:100}
        keep-alive-seconds: ${DEFAULT_TASK_KEEP_ALIVE:60}
        thread-name-prefix: ${DEFAULT_TASK_THREAD_NAME:default-task-}
        enable-virtual-thread: ${DEFAULT_TASK_VIRTUAL_THREAD_ENABLE:true}
  scheduler.configurations:
    default-async:
      scheduler-type: BOUNDED_ELASTIC
      bounded-elastic:
        name: default-async
        daemon: true
        core-pool-size: 5
        queue-size: 10
        ttl-in-seconds: 60
    auth-scheduler:
      scheduler-type: BOUNDED_ELASTIC
      bounded-elastic:
        name: ${AUTH_SCHEDULER_NAME:auth-scheduler}
        core-pool-size: ${AUTH_SCHEDULER_CORE_SIZE:10}
        queue-size: ${AUTH_SCHEDULER_QUEUE_SIZE:25}
        ttl-in-seconds: ${AUTH_SCHEDULER_TTL:30}
    retry-listener:
      scheduler-type: BOUNDED_ELASTIC
      bounded-elastic:
        name: retry-listener
        daemon: true
        core-pool-size: 10
        queue-size: 20
        ttl-in-seconds: 60
  cache.configurations:
    jslt:
      type: ${JSLT_CACHE_TYPE:SIZE}
      size: ${JSLT_CACHE_SIZE:200}
    parameters:
      type: ${PARAMETERS_CACHE_TYPE:TIME}
      time-out: ${PARAMETERS_CACHE_TIME_OUT:60}
      time-unit: ${PARAMETERS_CACHE_TIME_UNIT:SECONDS}
    contexts:
      type: ${CONTEXTS_CACHE_TYPE:TIME}
      time-out: ${CONTEXTS_CACHE_TIME_OUT:10}
      time-unit: ${CONTEXTS_CACHE_TIME_UNIT:MINUTES}
    additional-data:
      type: ${ADDITIONAL_DATA_CACHE_TYPE:TIME}
      time-out: ${ADDITIONAL_DATA_CACHE_TIME_OUT:10}
      time-unit: ${ADDITIONAL_DATA_CACHE_TIME_UNIT:MINUTES}
